# The hosted, read-only molecule MCP. Deploy with scripts/deploy-remote.sh.
# Its own app on Fly's default network: it serves the public internet
# unauthenticated, so it shares no private network with the platform.
app = "molecule-mcp"
primary_region = "iad"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
