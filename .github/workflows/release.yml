name: Release

# Hold lifted 2026-10-13 (owner): the repo is public and v2 ships. First
# release of a package npm has never seen (molecule-mcp ships with mlcl v2,
# so `npx mlcl mcp install` resolves the moment v2 is out):
#
#   1. Trust molecule-mcp BEFORE its first publish — from the owner's shell,
#      one 2FA code: `npm run trust:new` (scripts/trust-new-packages.mjs). It
#      sends the trust link with `createStagedPackage`, which npm accepts for a
#      name it has never seen, so even the first version publishes over OIDC.
#      (No local `npm publish`; same mechanism as molecule's `trust:new`.)
#   2. Dispatch this workflow with mcp_publish=true — it publishes mlcl v2
#      (its trust link exists: github / release.yml / molecule-dev/mlcl) and
#      molecule-mcp in the same run:
#        gh workflow run release.yml -R molecule-dev/mlcl -f mcp_publish=true
#
# Pre-flight status at hold-lift: mlcl@2.1.0 gates all green (0bef0c866+);
# molecule-mcp packs clean at 0.2.0 (19 files, 28.1 kB, smoke green).
#
# PUBLISH-ONLY — publishes mlcl (and molecule-mcp if staged) via CI, never from
# a laptop. Versioning is a LOCAL step (bump package.json + commit + push).
# Then dispatch this workflow: it builds, runs the full gate suite, and
# publishes what package.json declares and npm is missing.
#
# Gates that MUST pass before publish (in order):
#   1. npm run build (TypeScript compiles clean)
#   2. npm test (989+ tests incl. toolchain drift, registry sync)
#   3. scripts/prepublish-verify.mjs (tarball hygiene + secrets + paths)
#   4. scripts/check-parity-coverage.mjs (IDE⇄CLI parity manifest covers all routes)
#
# Auth paths (either works):
#   - vars.NPM_TRUSTED_PUBLISHING == 'true'  → OIDC (npm ≥11.5.1), no stored secret
#   - secrets.NPM_TOKEN != ''                 → legacy token
#
# molecule-mcp (in mcp/) publishes from the same dispatch when its version
# differs from npm. It flips `private` to false via the MCP_PUBLISH input.
on:
  workflow_dispatch:
    inputs:
      mcp_publish:
        description: 'Also publish molecule-mcp (flips its private flag in this run only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance (signed attestations)
    steps:
      - name: Assert an npm auth path exists
        env:
          OIDC_ON: ${{ vars.NPM_TRUSTED_PUBLISHING }}
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$OIDC_ON" != "true" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::No npm auth path: set the NPM_TRUSTED_PUBLISHING repo variable (OIDC) or the NPM_TOKEN secret."
            exit 1
          fi
          echo "auth path: $([ "$OIDC_ON" = "true" ] && echo OIDC || echo token)"

      # ci.yml's layout: mlcl in its own dir + the molecule SIBLING beside it —
      # DATA for the sibling-dependent gates (scanner, egressHosts coverage,
      # external-state coverage, toolchain drift), which run FOR REAL here, not
      # skipped. molecule is public; nothing installs or compiles it.
      - uses: actions/checkout@v4
        with:
          path: mlcl
      - name: Check out molecule (DATA for the sibling-dependent test gates)
        uses: actions/checkout@v4
        with:
          repository: molecule-dev/molecule
          path: molecule
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mlcl/package-lock.json
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm ≥11.5.1; Node 22 bundles 10.x.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci
        working-directory: mlcl

      # ---- GATE 1: Build ----------------------------------------------------
      - name: Build mlcl
        run: npm run build
        working-directory: mlcl

      # ---- GATE 2: Test suite ------------------------------------------------
      - name: Run full test suite
        run: npm test
        working-directory: mlcl

      # ---- GATE 3: Prepublish verification (tarball hygiene) ----------------
      - name: Prepublish gate
        run: node scripts/prepublish-verify.mjs
        working-directory: mlcl
        env:
          MLCL_ALLOW_PUBLISH: '1' # CI IS the authorized publish path
          # The history-depth check (≤200) was written days after the public
          # history restarted 2026-09-18; the legit post-wipe history passed
          # 688 commits by 2026-09-30 (verified: first commit = "mlcl 2.0.0 —
          # the Molecule.dev CLI", 2026-09-18). This is the intended public
          # history, not a pre-wipe resurrection — the documented escape hatch
          # applies. Revisit the threshold in the gate itself if it trips again.
          MLCL_ALLOW_DEEP_HISTORY: '1'

      # ---- GATE 4: Parity coverage (needs molecule-dev sibling) --------------
      # This is best-effort in CI — the molecule-dev sibling isn't always a
      # CI checkout. Run it when present, skip with a notice when not.
      - name: Parity coverage gate
        working-directory: mlcl
        run: |
          if [ -f ../molecule-dev/api/src/App/router.ts ]; then
            node scripts/check-parity-coverage.mjs
          else
            echo "::notice::molecule-dev sibling not present — parity coverage skipped (run locally before release)"
          fi

      # ---- PUBLISH mlcl ------------------------------------------------------
      - name: Publish mlcl
        working-directory: mlcl
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # package.json's prepublishOnly re-runs prepublish-verify.mjs — the
          # same authorized-CI-publisher + history switches GATE 3 sets.
          MLCL_ALLOW_PUBLISH: '1'
          MLCL_ALLOW_DEEP_HISTORY: '1'

      # ---- PUBLISH molecule-mcp (optional) ------------------------------------
      - name: Publish molecule-mcp
        if: inputs.mcp_publish
        working-directory: mlcl/mcp
        run: |
          # Flip private → publishable for this run only (no commit needed).
          node -e "const p=require('./package.json'); delete p.private; require('fs').writeFileSync('./package.json', JSON.stringify(p,null,2)+'\n')"
          npm install
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish summary
        working-directory: mlcl
        run: |
          echo "✓ mlcl@$(node -e "console.log(require('./package.json').version)") published"
          if [ "${{ inputs.mcp_publish }}" = "true" ]; then
            echo "✓ molecule-mcp@$(node -e "console.log(require('./mcp/package.json').version)") published"
          fi
