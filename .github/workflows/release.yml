name: Release
run-name: 'Release (${{ inputs.requester }})'

# PUBLISH-ONLY — publishes mlcl (and molecule-mcp if staged) via CI, never from
# a laptop. Version package.json and commit before using the guarded workspace
# release runner's publish-mlcl stage. It verifies the exact version on npm,
# dispatches with a requester identity and commit, and watches only that run.
#
# Gates that MUST pass before publish (in order):
#   1. npm run build (TypeScript compiles clean)
#   2. npm test (989+ tests incl. toolchain drift, registry sync)
#   3. scripts/prepublish-verify.mjs (tarball hygiene + secrets + paths)
#   4. scripts/check-parity-coverage.mjs (IDE⇄CLI parity manifest covers all routes)
#
# Auth paths (either works):
#   - vars.NPM_TRUSTED_PUBLISHING == 'true'  → OIDC (npm ≥11.5.1), no stored secret
#   - secrets.NPM_TOKEN != ''                 → legacy token
#
# molecule-mcp (in mcp/) publishes from the same dispatch when its version
# differs from npm. It flips `private` to false via the MCP_PUBLISH input.
on:
  workflow_dispatch:
    inputs:
      requester:
        description: 'Identity of the guarded release invocation'
        required: true
        type: string
      expected_sha:
        description: 'Full commit SHA authorized for publication'
        required: true
        type: string
      mcp_publish:
        description: 'Also publish molecule-mcp (flips its private flag in this run only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance (signed attestations)
    steps:
      - name: Verify publication commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ || "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::The release ref does not match the authorized publication commit."
            exit 1
          fi

      - name: Assert an npm auth path exists
        env:
          OIDC_ON: ${{ vars.NPM_TRUSTED_PUBLISHING }}
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$OIDC_ON" != "true" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::No npm auth path: set the NPM_TRUSTED_PUBLISHING repo variable (OIDC) or the NPM_TOKEN secret."
            exit 1
          fi
          echo "auth path: $([ "$OIDC_ON" = "true" ] && echo OIDC || echo token)"

      # ci.yml's layout: mlcl in its own dir + the molecule SIBLING beside it —
      # DATA for the sibling-dependent gates (scanner, egressHosts coverage,
      # external-state coverage, toolchain drift), which run FOR REAL here, not
      # skipped. molecule is public; nothing installs or compiles it.
      - uses: actions/checkout@v7
        with:
          path: mlcl
      - name: Check out molecule (DATA for the sibling-dependent test gates)
        uses: actions/checkout@v7
        with:
          repository: molecule-dev/molecule
          path: molecule
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: mlcl/package-lock.json
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm ≥11.5.1; Node 22 bundles 10.x.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci
        working-directory: mlcl

      # ---- GATE 1: Build ----------------------------------------------------
      - name: Build mlcl
        run: npm run build
        working-directory: mlcl

      # ---- GATE 2: Test suite ------------------------------------------------
      # The molecule-mcp suites need mcp/'s own node_modules (not a workspace
      # member); without them they skip and the gate passes untested — same
      # install as ci.yml.
      - name: Install molecule-mcp deps
        run: npm install --no-audit --no-fund
        working-directory: mlcl/mcp
      - name: Run full test suite
        run: npm test
        working-directory: mlcl

      # ---- GATE 3: Prepublish verification (tarball hygiene) ----------------
      - name: Prepublish gate
        id: package-artifact
        run: |
          PACK_DIR="$(mktemp -d "$RUNNER_TEMP/mlcl-publish.XXXXXX")"
          TARBALL="$PACK_DIR/mlcl-$(node -p 'require("./package.json").version').tgz"
          npm pack --json --pack-destination "$PACK_DIR" > "$PACK_DIR/pack.json"
          TARBALL_SHA256="$(sha256sum "$TARBALL" | cut -d ' ' -f 1)"
          node scripts/prepublish-verify.mjs --tarball "$TARBALL"
          printf '%s  %s\n' "$TARBALL_SHA256" "$TARBALL" | sha256sum --strict --check
          printf 'tarball=%s\nsha256=%s\n' "$TARBALL" "$TARBALL_SHA256" >> "$GITHUB_OUTPUT"
        working-directory: mlcl
        env:
          MLCL_ALLOW_PUBLISH: '1' # CI IS the authorized publish path
          # The history-depth check (≤200) was written days after the public
          # history restarted 2026-09-18; the legit post-wipe history passed
          # 688 commits by 2026-09-30 (verified: first commit = "mlcl 2.0.0 —
          # the Molecule.dev CLI", 2026-09-18). This is the intended public
          # history, not a pre-wipe resurrection — the documented escape hatch
          # applies. Revisit the threshold in the gate itself if it trips again.
          MLCL_ALLOW_DEEP_HISTORY: '1'

      # ---- GATE 4: Parity coverage (needs molecule-dev sibling) --------------
      # This is best-effort in CI — the molecule-dev sibling isn't always a
      # CI checkout. Run it when present, skip with a notice when not.
      - name: Parity coverage gate
        working-directory: mlcl
        run: |
          if [ -f ../molecule-dev/api/src/App/router.ts ]; then
            node scripts/check-parity-coverage.mjs
          else
            echo "::notice::molecule-dev sibling not present — parity coverage skipped (run locally before release)"
          fi

      # ---- PUBLISH mlcl ------------------------------------------------------
      # Idempotent: a dispatch that only moves molecule-mcp (same mlcl version
      # already on npm) must not die on EPUBLISHCONFLICT before it reaches the
      # mcp step below.
      - name: Publish mlcl
        working-directory: mlcl
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if npm view mlcl@"$VERSION" version >/dev/null 2>&1; then
            echo "mlcl@$VERSION is already on npm — nothing to publish"
          else
            printf '%s  %s\n' "$TARBALL_SHA256" "$TARBALL" | sha256sum --strict --check
            npm publish "$TARBALL" --provenance --access public
          fi
        env:
          TARBALL: ${{ steps.package-artifact.outputs.tarball }}
          TARBALL_SHA256: ${{ steps.package-artifact.outputs.sha256 }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The verified tarball is published unchanged; npm does not repack a
          # tarball. Ordinary folder publication retains prepublishOnly protection.
          MLCL_ALLOW_PUBLISH: '1'
          MLCL_ALLOW_DEEP_HISTORY: '1'

      # ---- PUBLISH molecule-mcp (optional) ------------------------------------
      # OIDC trusted publishing — the repo has no NPM_TOKEN secret. The publish
      # authenticates through the workflow's id-token once the package's
      # trusted-publisher link on npmjs.com names molecule-dev/mlcl +
      # release.yml (npm requires the owner's OTP to add it).
      - name: Publish molecule-mcp
        if: inputs.mcp_publish
        working-directory: mlcl/mcp
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if npm view molecule-mcp@"$VERSION" version >/dev/null 2>&1; then
            echo "molecule-mcp@$VERSION is already on npm — nothing to publish"
          else
            # Flip private → publishable for this run only (no commit needed).
            node -e "const p=require('./package.json'); delete p.private; require('fs').writeFileSync('./package.json', JSON.stringify(p,null,2)+'\n')"
            npm install
            npm run build
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish summary
        working-directory: mlcl
        run: |
          echo "✓ mlcl@$(node -e "console.log(require('./package.json').version)") published"
          if [ "${{ inputs.mcp_publish }}" = "true" ]; then
            echo "✓ molecule-mcp@$(node -e "console.log(require('./mcp/package.json').version)") published"
          fi
