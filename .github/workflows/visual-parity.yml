name: Visual parity

# Every framework's component showcase renders what React's does (src/lib/__tests__/visual/cross-framework.spec.ts; one
# job per framework, each beside React's showcase). CI runs it on every push and pull request (ci.yml).
#
# The showcases install their @molecule/* packages from npm at the pins registry.json writes
# (MOLECULE_SHOWCASE_PACKAGES=npm): this checkout has no molecule repo to link them from, and it is what a project a
# user scaffolds installs. Locally, inside molecule-workspace, the default links the checkout instead.
on:
  workflow_call:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every framework of VISUAL_TEST_FRAMEWORKS (src/lib/visual-test.ts) besides React, which each job starts too
        # as the reference. workflow-visual-parity.test.ts checks this list against that one.
        framework: [vue, svelte, solid, angular, react-native-web]
    name: compare (${{ matrix.framework }}) vs React
    steps:
      # mlcl in its own directory: the shared browser step (and CI's build job) expect it there.
      - uses: actions/checkout@v7
        with:
          path: mlcl
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: mlcl/package-lock.json
      - run: npm ci
        working-directory: mlcl
      # The Chromium build this checkout's @playwright/test pins, launched once: the same step installs it for `npm test`.
      - name: Install Chromium
        uses: ./mlcl/.github/actions/test-browser
        timeout-minutes: 10
      - name: Compare the showcase with React's
        working-directory: mlcl
        env:
          MOLECULE_SHOWCASE_PACKAGES: npm
          MOLECULE_SHOWCASE_FRAMEWORKS: ${{ matrix.framework }}
        run: npx --no-install playwright test --reporter=list
      # React's screenshots, the framework's and the differences of each failing comparison.
      - name: Keep the comparison images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-parity-${{ matrix.framework }}
          path: mlcl/.playwright-results
          include-hidden-files: true
          if-no-files-found: ignore
