    <script>
      // mol:icon-healer — the bundled icon font is a SUBSET (fleet census,
      // capped at the ~350 names Google's icon_names accepts). If a page uses
      // a ligature outside the subset, the span renders as raw text
      // (document.fonts.check is BLIND to this — the letters are covered, the
      // ligature is not) — so detect by WIDTH: a ligature glyph is ~1em wide,
      // a raw ligature name is several em. Load the static full instance
      // (324KB, every icon) once; the newly-added face wins font matching and
      // every icon renders. Pairs with the mol:icon-gate CSS (injected by
      // this sweep): icons are hidden from FIRST PAINT until the healer adds
      // .mol-icons-ready to <html> — a blank gap beats raw ligature text in
      // the pre-font flash window, and no JS poll can win that race.
      ;(function () {
        var tried = 0
        var fullRequested = false
        function markReady() {
          document.documentElement.classList.add('mol-icons-ready')
        }
        function offending(s) {
          var name = (s.textContent || '').trim()
          if (!name) return false
          var fs = parseFloat(getComputedStyle(s).fontSize) || 24
          return s.offsetWidth > fs * 1.8
        }
        function each(fn) {
          var spans = document.querySelectorAll('.material-symbols-outlined')
          for (var i = 0; i < spans.length; i++) fn(spans[i])
        }
        function needsFull() {
          var found = false
          each(function (s) {
            if (!found && offending(s)) found = true
          })
          return found
        }
        function requestFull() {
          if (fullRequested) return true
          fullRequested = true
          try {
            var f = new FontFace(
              'Material Symbols Outlined',
              "url('/fonts/MaterialSymbolsOutlined.static.woff2') format('woff2')",
              { weight: '100 700', style: 'normal', display: 'block' },
            )
            f.load()
              .then(function (lf) {
                document.fonts.add(lf)
                // two frames: let the new face apply before showing
                requestAnimationFrame(function () {
                  requestAnimationFrame(markReady)
                })
              })
              .catch(markReady)
          } catch (e) {
            markReady()
          }
          return true
        }
        function sweep() {
          var spans = document.querySelectorAll('.material-symbols-outlined')
          if (spans.length > 0) {
            if (!needsFull()) {
              // subset covers every mounted icon — show now, but keep the
              // bounded watch in case a late route mounts an uncovered one
              markReady()
            } else if (requestFull()) {
              return
            }
          }
          if (tried++ < 6) setTimeout(sweep, 1500)
        }
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(sweep)
        else window.addEventListener('load', sweep)
        // Failsafe: even if measurement or the face load never resolves,
        // icons come back (worst case as raw text) instead of staying blank.
        setTimeout(markReady, 3000)
      })()
    </script>
