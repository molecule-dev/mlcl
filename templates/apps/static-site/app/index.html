    <script>
      // mol:icon-healer — the bundled icon font is a SUBSET (fleet census,
      // capped at the ~350 names Google's icon_names accepts). If a page uses
      // a ligature outside the subset, the span renders as raw text
      // (document.fonts.check is BLIND to this — the letters are covered, the
      // ligature is not) — so detect by WIDTH: a ligature glyph is ~1em wide,
      // a raw ligature name is several em. Load the static full instance
      // (324KB, every icon) once; the newly-added face wins font matching and
      // every icon renders. Pairs with the mol:icon-gate CSS (injected by
      // this sweep): icons are hidden from FIRST PAINT until the healer adds
      // .mol-icons-ready to <html> — a blank gap beats raw ligature text in
      // the pre-font flash window, and no JS poll can win that race.
      ;(function () {
        var tried = 0
        var fullRequested = false
        function markReady() {
          document.documentElement.classList.add('mol-icons-ready')
        }
        function offending(s) {
          var name = (s.textContent || '').trim()
          if (!name) return false
          var fs = parseFloat(getComputedStyle(s).fontSize) || 24
          return s.offsetWidth > fs * 1.8
        }
        function each(fn) {
          var spans = document.querySelectorAll('.material-symbols-outlined')
          for (var i = 0; i < spans.length; i++) fn(spans[i])
        }
        function needsFull() {
          var found = false
          each(function (s) {
            if (!found && offending(s)) found = true
          })
          return found
        }
        function requestFull() {
          if (fullRequested) return true
          fullRequested = true
          try {
            var f = new FontFace(
              'Material Symbols Outlined',
              "url('/fonts/MaterialSymbolsOutlined.static.woff2') format('woff2')",
              { weight: '100 700', style: 'normal', display: 'block' },
            )
            f.load()
              .then(function (lf) {
                document.fonts.add(lf)
                // two frames: let the new face apply before showing
                requestAnimationFrame(function () {
                  requestAnimationFrame(markReady)
                })
              })
              .catch(markReady)
          } catch (e) {
            markReady()
          }
          return true
        }
        function sweep() {
          var spans = document.querySelectorAll('.material-symbols-outlined')
          if (spans.length > 0) {
            if (!needsFull()) {
              // subset covers every mounted icon — show now, but keep the
              // bounded watch in case a late route mounts an uncovered one
              markReady()
            } else if (requestFull()) {
              return
            }
          }
          if (tried++ < 6) setTimeout(sweep, 1500)
        }
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(sweep)
        else window.addEventListener('load', sweep)
        // Failsafe: even if measurement or the face load never resolves,
        // icons come back (worst case as raw text) instead of staying blank.
        setTimeout(markReady, 3000)
      })()
    </script>

    <script>
      // Signal the parent IDE when the app renders, crashes, or recovers.
      // Used by PreviewPanel to manage the loading overlay.
      ;(function () {
        if (!window.parent || window.parent === window) return
        var root = document.getElementById('root') || document.getElementById('app')
        if (!root) return

        // --- Rate-limiting to prevent infinite loop freezes ---
        var transitions = [] // timestamps of recent ready↔error transitions
        var WINDOW = 5000 // 5s sliding window
        var MAX_TRANSITIONS = 12 // max transitions in window before suppressing
        var suppressed = false
        var errorCount = 0 // runtime errors since last reset
        var MAX_ERRORS_PER_SEC = 20 // cap error messages per second
        var errorResetTimer = null

        function post(type, msg, extra) {
          var data = { type: type }
          if (msg) data.message = msg
          if (extra) for (var k in extra) data[k] = extra[k]
          window.parent.postMessage(data, '*')
        }

        function trackTransition() {
          var now = Date.now()
          transitions.push(now)
          // Trim old entries
          while (transitions.length > 0 && now - transitions[0] > WINDOW) transitions.shift()
          if (transitions.length >= MAX_TRANSITIONS && !suppressed) {
            suppressed = true
            console.warn(
              '[molecule:preview] Rapid ready/error cycle detected (' +
                transitions.length +
                ' in ' +
                WINDOW +
                'ms) — suppressing messages to prevent freeze',
            )
            // Auto-recover after the storm passes
            setTimeout(function () {
              suppressed = false
              transitions = []
            }, WINDOW)
          }
          return suppressed
        }

        // Catch runtime errors and unhandled rejections.
        // Before render: show overlay via molecule:error.
        // After render: forward to IDE chat via molecule:runtime-error (for AI auto-fix).
        // Post-render crashes (empty #root) are detected by the MutationObserver below.
        window.addEventListener('error', function (e) {
          // Rate-limit error messages to prevent flood
          errorCount++
          if (errorCount > MAX_ERRORS_PER_SEC) {
            if (errorCount === MAX_ERRORS_PER_SEC + 1) {
              console.warn(
                '[molecule:preview] Error flood detected (' +
                  errorCount +
                  ' errors) — suppressing further error messages',
              )
            }
            return
          }
          if (!errorResetTimer) {
            errorResetTimer = setTimeout(function () {
              errorCount = 0
              errorResetTimer = null
            }, 1000)
          }
          if (!hadContent) {
            post('molecule:error', e.message || 'Runtime error', {
              source: e.filename || undefined,
              line: e.lineno || undefined,
              column: e.colno || undefined,
            })
          } else {
            post('molecule:runtime-error', null, {
              message: String(e.message || 'Runtime error'),
              source: e.filename || undefined,
              line: e.lineno || undefined,
              column: e.colno || undefined,
            })
          }
        })
        window.addEventListener('unhandledrejection', function (e) {
          errorCount++
          if (errorCount > MAX_ERRORS_PER_SEC) return
          if (!errorResetTimer) {
            errorResetTimer = setTimeout(function () {
              errorCount = 0
              errorResetTimer = null
            }, 1000)
          }
          var msg =
            e.reason?.message ||
            (typeof e.reason === 'string' ? e.reason : 'Unhandled promise rejection')
          if (!hadContent) {
            var stack = e.reason?.stack || ''
            var srcMatch = stack.match(/(?:at\s+)?(?:\S+\s+)?\(?(\S+):(\d+):(\d+)\)?/)
            post('molecule:error', msg, {
              source: srcMatch ? srcMatch[1] : undefined,
              line: srcMatch ? parseInt(srcMatch[2], 10) : undefined,
              column: srcMatch ? parseInt(srcMatch[3], 10) : undefined,
            })
          } else {
            post('molecule:runtime-error', null, {
              message: String(msg),
              source: 'unhandledrejection',
            })
          }
        })
        // Continuously watch #root — detect render, crash (empty), and recovery.
        // HMR updates don't trigger iframe onLoad, so this is the only way to
        // detect mid-session crashes from broken code written by the AI.
        var hadContent = false
        var pendingCheck = false
        new MutationObserver(function () {
          if (pendingCheck) return
          pendingCheck = true
          requestAnimationFrame(function () {
            pendingCheck = false
            var hasContent = root.children.length > 0
            if (hasContent && !hadContent) {
              hadContent = true
              if (!trackTransition()) {
                post('molecule:ready')
                setTimeout(checkBlank, 2000)
              }
            } else if (!hasContent && hadContent) {
              hadContent = false
              if (!trackTransition())
                post('molecule:error', 'App crashed during update', { crash: true })
            }
          })
        }).observe(root, { childList: true })
        // Detect Vite error overlay — catches compilation errors that don't fire window.onerror
        new MutationObserver(function (mutations) {
          for (var i = 0; i < mutations.length; i++) {
            for (var j = 0; j < mutations[i].addedNodes.length; j++) {
              var node = mutations[i].addedNodes[j]
              if (node.tagName === 'VITE-ERROR-OVERLAY') {
                // Extract error from Shadow DOM after a tick (populates async)
                setTimeout(function () {
                  var sr = node.shadowRoot
                  if (!sr) return
                  var msgEl = sr.querySelector('.message-body') || sr.querySelector('.message')
                  var fileEl = sr.querySelector('.file')
                  var frameEl = sr.querySelector('.frame')
                  var message = (msgEl ? msgEl.textContent : '') || 'Vite compilation error'
                  var file = fileEl ? fileEl.textContent : ''
                  var frame = frameEl ? frameEl.textContent : ''
                  post('molecule:runtime-error', null, {
                    message: message.trim() + (file ? ' in ' + file.trim() : ''),
                    source: file ? file.trim() : 'vite',
                    detail: frame ? frame.trim() : undefined,
                  })
                }, 100)
              }
            }
          }
        }).observe(document.documentElement, { childList: true })
        // Heartbeat — lets parent distinguish alive-but-broken from dead
        setInterval(function () {
          post('molecule:heartbeat')
        }, 3000)
        // --- Browser console capture → /__molecule_log ---
        // Mirror console.* + uncaught errors to a buffer and POST batches to the
        // dev server, whose middleware appends them to /tmp/browser.log so the IDE
        // AI can read the live app's console via its read_logs tool. Only runs when
        // embedded (this IIFE already returns early when not in the IDE); in a
        // production build there's no middleware, so the POST simply 404s + is
        // swallowed.
        ;(function () {
          var buf = [] // pending entries
          var MAX_BUF = 200 // cap memory if the app spams logs
          function ser(a) {
            try {
              if (a instanceof Error) return a.stack || a.name + ': ' + a.message
              if (typeof a === 'string') return a
              if (typeof a === 'object') return JSON.stringify(a)
              return String(a)
            } catch (e) {
              return String(a)
            }
          }
          function rec(level, parts) {
            if (buf.length < MAX_BUF)
              buf.push({ l: level, m: parts.join(' ').slice(0, 2000), t: Date.now() })
          }
          ;['log', 'info', 'warn', 'error', 'debug'].forEach(function (level) {
            var orig = console[level] ? console[level].bind(console) : function () {}
            console[level] = function () {
              orig.apply(null, arguments)
              try {
                var parts = []
                for (var i = 0; i < arguments.length; i++) parts.push(ser(arguments[i]))
                rec(level, parts)
              } catch (e) {}
            }
          })
          window.addEventListener('error', function (e) {
            rec('error', [
              'Uncaught: ' +
                (e.message || 'error') +
                (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : ''),
            ])
          })
          window.addEventListener('unhandledrejection', function (e) {
            var m =
              (e.reason && e.reason.message) ||
              (typeof e.reason === 'string' ? e.reason : 'Unhandled rejection')
            rec('error', ['Unhandled rejection: ' + m])
          })
          var sending = false
          function flush() {
            if (sending || !buf.length) return
            sending = true
            var batch = buf.splice(0, buf.length)
            try {
              fetch('/__molecule_log', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify(batch),
                keepalive: true,
              })
                .catch(function () {})
                .finally(function () {
                  sending = false
                })
            } catch (e) {
              sending = false
            }
          }
          setInterval(flush, 1000)
          window.addEventListener('beforeunload', flush)
        })()
        // Blank page detection — fires after render if page has no visible content
        function checkBlank() {
          if (!root.children.length) return
          var text = root.innerText || ''
          var rect = root.getBoundingClientRect()
          if (text.trim().length === 0 && rect.height < 10) {
            post('molecule:blank', 'Page rendered but appears blank (no visible text content)')
          }
        }
        // Check initial state
        if (root.children.length > 0) {
          hadContent = true
          post('molecule:ready')
          setTimeout(checkBlank, 2000)
        }
        // Detect 5XX network errors from fetch and XMLHttpRequest.
        // Debounced and deduplicated — reports each failing URL at most once per 10s.
        var recentNetErrors = {} // url → timestamp
        var netErrorBatch = []
        var netErrorTimer = null
        var NET_ERROR_DEDUP_MS = 10000
        var NET_ERROR_DEBOUNCE_MS = 2000
        var MAX_NET_ERRORS_PER_BATCH = 5
        function reportNetError(status, url, method) {
          var now = Date.now()
          // Strip query string for dedup key
          var key = (method || 'GET') + ' ' + url.replace(/\?.*$/, '')
          if (recentNetErrors[key] && now - recentNetErrors[key] < NET_ERROR_DEDUP_MS) return
          recentNetErrors[key] = now
          if (netErrorBatch.length < MAX_NET_ERRORS_PER_BATCH) {
            // Strip origin to get a readable path
            var path = url
            try {
              path = new URL(url).pathname
            } catch (e) {}
            netErrorBatch.push({ status: status, method: method || 'GET', path: path })
          }
          if (netErrorTimer) clearTimeout(netErrorTimer)
          netErrorTimer = setTimeout(function () {
            if (netErrorBatch.length > 0) {
              var lines = netErrorBatch.map(function (e) {
                return e.method + ' ' + e.path + ' → ' + e.status
              })
              post('molecule:runtime-error', null, {
                message: 'Server returned error responses:\n' + lines.join('\n'),
                source: 'network',
              })
              netErrorBatch = []
            }
            netErrorTimer = null
          }, NET_ERROR_DEBOUNCE_MS)
        }
        // Intercept fetch
        var origFetch = window.fetch
        window.fetch = function () {
          var url = typeof arguments[0] === 'string' ? arguments[0] : arguments[0]?.url || ''
          var method = arguments[1]?.method || 'GET'
          return origFetch.apply(this, arguments).then(function (response) {
            if (response.status >= 500) reportNetError(response.status, url, method)
            return response
          })
        }
        // Intercept XMLHttpRequest
        var origXHROpen = XMLHttpRequest.prototype.open
        var origXHRSend = XMLHttpRequest.prototype.send
        XMLHttpRequest.prototype.open = function (method, url) {
          this._molMethod = method
          this._molUrl = url
          return origXHROpen.apply(this, arguments)
        }
        XMLHttpRequest.prototype.send = function () {
          var xhr = this
          xhr.addEventListener('load', function () {
            if (xhr.status >= 500)
              reportNetError(xhr.status, xhr._molUrl || '', xhr._molMethod || 'GET')
          })
          return origXHRSend.apply(this, arguments)
        }
      })()
    </script>

    <!--
      The bidirectional preview-nav bridge (molecule:navigate sender for the URL
      bar PV2 + molecule:nav-command receiver for Back/Forward PV3) is appended
      right before </body> at scaffold time by injectPreviewNavBridge() in
      mlcl/src/lib/scaffold.ts — one source that reaches custom builds AND all
      flagship templates, so it is intentionally NOT hardcoded here.
    -->
    <!-- mol:nav-bridge -->
    <script>
      // molecule:navigate    — report client-side navigations to the parent IDE so the
      //                         URL bar shows the live URL (PV2) + Back/Forward work (PV3).
      // molecule:nav-command — receive Back/Forward from the host and drive the iframe's
      //                         OWN history (real client-side nav, not a cold reload, PV3).
      // The host (IframePreviewProvider) validates + dedupes the reported URL.
      // No-op outside the IDE iframe (production runs standalone).
      ;(function () {
        if (!window.parent || window.parent === window) return
        // isReplace tells the host whether the nav REPLACED the current history
        // entry (replaceState — a redirect/canonicalization) or ADDED one
        // (pushState/popstate/hashchange). The host preserves the Forward stack on
        // a replace and truncates it only on a push, so a replaceState-redirect-on-
        // load (e.g. an auth guard) no longer kills Forward.
        function report(isReplace) {
          try {
            window.parent.postMessage(
              { type: 'molecule:navigate', url: location.href, isReplace: !!isReplace },
              '*',
            )
          } catch (_e) {
            // Parent gone / cross-origin restriction — nothing to report; safe to ignore.
          }
        }
        // SPA routers navigate via history.pushState/replaceState, which fire no
        // event — patch them to report after the URL has actually changed.
        // pushState ADDS an entry (report as push); replaceState SWAPS the current
        // one (report as replace so the host keeps the Forward stack).
        var origPush = history.pushState
        var origReplace = history.replaceState
        history.pushState = function () {
          var result = origPush.apply(this, arguments)
          report(false)
          return result
        }
        history.replaceState = function () {
          var result = origReplace.apply(this, arguments)
          report(true)
          return result

        // When THIS document loaded. The script is injected in <head>
        // <meta name="generator" content="molecule.dev">, so it is the page's
        // own age — and the paint gate below is measured from it, NOT from when a command
        // arrives. That distinction is the whole difference between "wait, it is still
        // starting up" and "wait forever on a page that is simply blank": budgeted from the
        // command, every single read of a blank preview paid the full boot grace, which is
        // exactly when the executor reads it most.
        var loadedAt = Date.now()
        // DOM-quiescence signal for the settle below: route transitions, lazy route
        // chunks (dynamic import — invisible to the fetch shim), and animations mutate
        // the DOM with ZERO network pending; snapshotting mid-transition made the
        // executor conclude a click did nothing.
        var lastMutation = loadedAt
        try {
          new MutationObserver(function () {
            lastMutation = Date.now()
          }).observe(document.documentElement, {
            childList: true,
            subtree: true,
            attributes: true,
            characterData: true,
          })
        } catch (e) {}
        // Settle budgets (ms).
        var BOOT_MS = 8000 // how long after load an empty page still counts as "starting"
        var NET_MS = 8000 // max wait for in-flight requests to drain
        var DOM_MS = 4000 // max wait for DOM mutations to stop
        var QUIET_MS = 300 // mutation-free window that counts as settled
        var FIND_MS = 3000 // auto-wait for a target that is still mounting
        // Hard ceiling for ONE command, shared by every gate it passes through. The gates
        // used to be independent budgets that ADDED UP (paint + find + settle ≈ 32s), which
        // overran the tool's own wait — a deliberate settle then reported as "the preview is
        // not drivable", the opposite of what it was for. The server waits 30s (45s to
        // navigate), so one command must always answer well inside that.
        var TOTAL_MS = 20000
        function molRoot() {
          return (
            document.getElementById('root') ||
            document.getElementById('app') ||
            document.body ||
            null
          )
        }
        // "The app drew something" — same heuristic the nav bridge uses for molecule:ready:
        // a non-body root needs children + real height; a body root needs a NON-chrome child
        // with real height, so the injected bridge tags alone never count as a render.
        function rootHasContent() {
          try {
            var root = molRoot()
            if (!root) return false
            if (root !== document.body)
              return root.children.length > 0 && root.getBoundingClientRect().height > 10
            for (var i = 0; i < root.children.length; i++) {
              var el = root.children[i]
              if (/^(SCRIPT|STYLE|LINK|META|TEMPLATE|BASE|TITLE|NOSCRIPT)$/.test(el.tagName))
                continue
              try {
                if (el.getBoundingClientRect().height > 10) return true
              } catch (e2) {}
            }
            return false
          } catch (e) {
            return false
          }
        }
        function present() {
          return document.readyState !== 'loading' && rootHasContent()
        }
        // Whether an empty page is plausibly STILL STARTING rather than simply blank. Age of
        // the document, not of the command — so the boot grace is paid once per page load,
        // not on every call for the rest of that page's life.
        function booting() {
          return Date.now() - loadedAt < BOOT_MS
        }
        // Hidden page (the IDE tab is backgrounded / the browser minimized): browsers
        // throttle timers here -- Chrome's intensive throttling runs ONE timer tick per
        // MINUTE -- so any settle wait would overrun the tool's reply window and read as
        // 'preview not drivable'. Nothing animates in a hidden page anyway: answer
        // single-shot instead of waiting.
        function hid() {
          try {
            return document.hidden === true
          } catch (e) {
            return false
          }
        }
        // Run fn once the page EXISTS (parsed + something rendered) — or as soon as it is
        // clear it never will, so a broken app is REPORTED broken instead of stalling.
        function whenPresent(fn, deadline) {
          ;(function wait() {
            if (!present() && booting() && Date.now() < deadline && !hid())
              return setTimeout(wait, 100)
            fn()
          })()
        }
        // Hold the reply until the page is SETTLED, then snapshot. Two gates, both under the
        // command's single deadline:
        //   1. present — the document parsed and the app rendered something (only worth
        //      waiting for while the page is still booting).
        //   2. quiet — no requests in flight (NET_MS) and no DOM mutation for QUIET_MS
        //      (DOM_MS).
        // When a gate is abandoned on its budget rather than satisfied, the reply says so in
        // stillSettling — a race must be DISTINGUISHABLE from a genuinely broken page, or the
        // executor "fixes" the wrong thing.
        function settleThenReply(id, extra, deadline) {
          var t0 = Date.now()
          var end = deadline || t0 + TOTAL_MS
          ;(function step() {
            var now = Date.now()
            if (now < end && !hid()) {
              if (!present() && booting()) return setTimeout(step, 100)
              var waited = now - t0
              var busyNet = (window.__molNetPending || 0) > 0 && waited < NET_MS
              var busyDom = now - lastMutation < QUIET_MS && waited < DOM_MS
              if (busyNet || busyDom) return setTimeout(step, 150)
            }
            var out = { ok: true, snapshot: snapshot() }
            if (extra) {
              for (var k in extra) out[k] = extra[k]
            }
            var why = []
            if (document.readyState === 'loading') why.push('the document was still parsing')
            if (!rootHasContent())
              why.push(
                'the app root is EMPTY — nothing rendered' +
                  (booting()
                    ? ' yet'
                    : ' (this page has been up a while, so it is blank, not still loading — check read_logs for a runtime error)'),
              )
            if ((window.__molNetPending || 0) > 0) why.push('requests were still in flight')
            if (hid())
              why.push(
                'the page is backgrounded (browser timers are throttled), so settle waits were skipped',
              )
            if (why.length) {
              out.stillSettling =
                'Snapshot taken with the page unsettled after ' +
                Math.round((Date.now() - t0) / 1000) +
                's: ' +
                why.join('; ') +
                '. It may be INCOMPLETE — if the page was still loading, call ' +
                'read_preview_ui once more before concluding it is blank or a control is missing.'
            }
            reply(id, out)
          })()
        }
        function reply(id, obj) {
          obj.type = 'molecule:ui-result'
          obj.id = id
          var rn = recentNet()
          if (rn) obj.recentNetworkErrors = rn
          // Set by the log bridge when a dynamic app-module import failed on this page
          // (see noteDeadPage): the DOM below may be a non-interactive leftover shell.
          try {
            if (window.__molPageDead) {
              obj.pageDead =
                'A module import failed on this page (' +
                window.__molPageDead +
                ') so its JS may no longer run: clicks/fills can silently do NOTHING. Call reload_preview, then read_preview_ui again — do not keep interacting with this snapshot.'
            }
          } catch (e) {}
          if (id) uiResults[id] = obj
          try {
            window.parent.postMessage(obj, '*')
          } catch (e) {}
        }
        function run(cmd) {
          var id = cmd.id
          // ONE deadline for the whole command, shared by every gate below.
          var deadline = Date.now() + TOTAL_MS
          // Navigation: only the document the host navigated TO may answer. The page being
          // navigated AWAY from is still in the iframe when the command arrives, and it used
          // to answer first with a pre-navigation snapshot — so the executor "verified" the
          // screen it had just left. The host stamps minLoadedAt ONLY when a new document is
          // genuinely loading, so an outgoing document just stays quiet and the host's
          // re-post reaches the new one. Deterministic: no path or timing guesswork, and a
          // redirect (an auth guard) is answered as soon as it renders instead of waiting.
          if (cmd.minLoadedAt && loadedAt < cmd.minLoadedAt) return
          // snapshot — read_preview_ui, AND the reply the host enqueues for navigate_preview.
          // It used to answer SYNCHRONOUSLY, which is the biggest source of "the page never
          // loaded" false alarms: this script is injected in <head>
          // <meta name="generator" content="molecule.dev">, so after a navigate or
          // reload the FRESH document's bridge answers the host's re-post while the framework
          // is still booting — empty root, empty pageText, zero elements. Settle first.
          if (cmd.action === 'snapshot') return settleThenReply(id, null, deadline)
          if (cmd.action === 'waitFor') {
            var waitEnd = Math.min(Date.now() + Math.min(cmd.timeoutMs || 8000, 15000), deadline)
            ;(function poll() {
              var el = find(cmd)
              // Found is not the same as done — the element can appear a frame before the
              // data it renders, so settle before reporting what the screen shows.
              if (el && visible(el)) return settleThenReply(id, { found: true }, deadline)
              if (Date.now() > waitEnd || hid())
                return reply(id, {
                  ok: false,
                  error: 'timeout: ' + missError(cmd),
                  snapshot: snapshot(),
                })
              setTimeout(poll, 200)
            })()
            return
          }
          // scroll — the reading position is state too: a sticky bar, a panel that follows
          // the reader, a lazily rendered section can only be CHECKED by scrolling. With a
          // target, scroll it into view; without one, value is 'top' | 'bottom' | a pixel
          // offset. Replies with the settled snapshot (pageText includes fixed/sticky text).
          if (cmd.action === 'scroll') {
            whenPresent(function () {
              var target = cmd.molId || cmd.selector || cmd.text ? find(cmd) : null
              if ((cmd.molId || cmd.selector || cmd.text) && !target)
                return reply(id, { ok: false, error: missError(cmd), snapshot: snapshot() })
              try {
                if (target) {
                  highlight(target)
                  target.scrollIntoView({ block: 'start' })
                } else {
                  var v = String(cmd.value == null ? 'bottom' : cmd.value)
                    .trim()
                    .toLowerCase()
                  var y =
                    v === 'top'
                      ? 0
                      : v === 'bottom'
                        ? document.documentElement.scrollHeight
                        : Number(v)
                  if (!isFinite(y))
                    return reply(id, {
                      ok: false,
                      error: 'scroll value must be top, bottom or a pixel offset (got ' + v + ')',
                    })
                  window.scrollTo(0, y)
                }
              } catch (e) {
                return reply(id, {
                  ok: false,
                  error: String((e && e.message) || e),
                  snapshot: snapshot(),
                })
              }
              // Let scroll-driven UI (observers, sticky positioning) react before reading.
              setTimeout(function () {
                settleThenReply(
                  id,
                  {
                    scrollY: Math.round(window.scrollY),
                    scrollHeight: document.documentElement.scrollHeight,
                    viewportHeight: window.innerHeight,
                  },
                  deadline,
                )
              }, 450)
            }, deadline)
            return
          }
          // click / fill / select — never act on a page that has not rendered yet, and
          // auto-wait for a target that is still mounting (a lazy route chunk, a
          // data-gated render). Answering "element not found" the instant the command
          // landed made the executor conclude the control does not exist.
          whenPresent(function () {
            var findEnd = Math.min(Date.now() + FIND_MS, deadline)
            ;(function act() {
              var el = find(cmd)
              if (!el) {
                if (Date.now() < findEnd && !hid()) return setTimeout(act, 150)
                return reply(id, { ok: false, error: missError(cmd), snapshot: snapshot() })
              }
              highlight(el)
              try {
                if (cmd.action === 'click') el.click()
                else if (cmd.action === 'fill' || cmd.action === 'select') {
                  try {
                    el.focus()
                  } catch (e) {}
                  setNativeValue(el, cmd.value == null ? '' : String(cmd.value))
                } else return reply(id, { ok: false, error: 'unknown action: ' + cmd.action })
              } catch (e) {
                return reply(id, {
                  ok: false,
                  error: String((e && e.message) || e),
                  snapshot: snapshot(),
                })
              }
              // Post-action settle: a fixed 250ms raced the API round-trip a click triggers —
              // the snapshot showed the PRE-result UI (no QR yet) and the executor declared
              // failure. A minimum beat first (handlers may start work a frame later), then
              // the shared present+quiet gate above, which also covers a click that starts a
              // route transition (the new route's chunk, fetch, and render all land well
              // after the old 1.5s DOM cap gave up).
              if (hid()) return settleThenReply(id, null, deadline)
              setTimeout(function () {
                settleThenReply(id, null, deadline)
              }, 350)
            })()
          }, deadline)
        }
        window.addEventListener('message', function (event) {
          if (event.source !== window.parent) return
          var d = event.data
          if (!d || d.type !== 'molecule:ui-command') return
          // Idempotent retries: the host re-sends a command until it gets a reply (the iframe/bridge
          // is often mid-mount or mid-reload — after navigate_preview — when it first fires, so a
          // single postMessage is dropped). Re-send the cached result if already done; ignore a
          // retry that lands while still in progress so a click/fill NEVER double-fires.
          if (d.id) {
            if (uiResults[d.id]) {
              try {
                window.parent.postMessage(uiResults[d.id], '*')
              } catch (e) {}
              return
            }
            if (uiSeen[d.id]) return
            uiSeen[d.id] = true
          }
          try {
            run(d)
          } catch (e) {
            reply(d && d.id, { ok: false, error: String((e && e.message) || e) })
          }
        })
      })()
    </script>
  </body>
</html>
